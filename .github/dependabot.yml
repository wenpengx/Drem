version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      vite-react-tooling:
        patterns:
          - vite
          - vite-plugin-*
          - "@vitejs/*"
          - react
          - react-dom
          - "@types/react*"
      ui-and-runtime:
        patterns:
          - lucide-react
          - marked
          - dompurify
          - jszip
          - file-saver
          - i18next
          - react-i18next

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
